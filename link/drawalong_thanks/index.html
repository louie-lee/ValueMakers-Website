<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Draw Along - 감사 선물</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(#CDE9F8, #E8F6FF);
        }
        .card {
            text-align: center;
            background: #fff;
            border-radius: 24px;
            padding: 36px 28px;
            margin: 20px;
            max-width: 340px;
            box-shadow: 0 6px 24px rgba(50, 100, 140, 0.18);
        }
        .gift { font-size: 56px; }
        h1 { font-size: 22px; color: #2B3A4A; margin: 14px 0 8px; }
        p { font-size: 15px; color: #5A6B7A; line-height: 1.6; margin: 0 0 22px; }
        .btn {
            display: block;
            background: #63B84F;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 999px;
            padding: 15px 20px;
            box-shadow: 0 4px 0 #4A9138;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4A9138; }
        .hint { font-size: 12px; color: #8A9AA8; margin-top: 16px; line-height: 1.6; }
        .error { color: #C05050; }
    </style>
</head>
<body>
    <div class="card">
        <div class="gift">🎁</div>
        <h1 id="title">고마워요!</h1>
        <p id="body">인터뷰에 함께해 주셔서 감사해요.<br>아래 버튼을 누르면 Draw Along 앱에서<br>특별한 선물 가격이 열려요.</p>
        <a class="btn" id="open" href="#">앱에서 선물 받기</a>
        <p class="hint" id="hint">앱이 설치되어 있지 않다면 설치 화면으로 이동해요.<br>설치 후 이 링크를 다시 눌러주세요.</p>
    </div>

    <script>
        (function() {
            var PLAY_URL = 'https://play.google.com/store/apps/details?id=draw.along';

            function getParam(name) {
                var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
                return m ? decodeURIComponent(m[1]) : '';
            }

            var code = getParam('k');
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua);
            var btn = document.getElementById('open');

            // 코드 형식 확인 (정식 검증은 앱이 한다 — 여기선 오타 안내만)
            if (!/^THX-[A-Z2-9]{4}-[A-Z2-9]$/i.test(code)) {
                document.getElementById('title').textContent = '링크가 유효하지 않아요';
                document.getElementById('title').className = 'error';
                document.getElementById('body').innerHTML = '받으신 링크 주소를 다시 확인해 주세요.';
                btn.style.display = 'none';
                document.getElementById('hint').style.display = 'none';
                return;
            }

            if (isIOS) {
                // iOS 선물은 App Store 오퍼 코드로 제공 — 이 링크는 Android용
                document.getElementById('body').innerHTML =
                    '아이폰·아이패드에서는 함께 보내드린<br>App Store 링크로 선물을 받아주세요.';
                btn.style.display = 'none';
                document.getElementById('hint').style.display = 'none';
                return;
            }

            // Android: intent 스킴 — 앱이 있으면 열고, 없으면 Play 스토어로 폴백.
            // 카카오톡 인앱 브라우저·Chrome·삼성 브라우저 모두 동작
            btn.href = 'intent://thanks?k=' + encodeURIComponent(code) +
                '#Intent;scheme=drawalong;package=draw.along;S.browser_fallback_url=' +
                encodeURIComponent(PLAY_URL) + ';end';
        })();
    </script>
</body>
</html>
